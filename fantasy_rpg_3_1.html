['하늘을 가르는 균열이 커지기 시작한다.', ['균열 가까이 가서 변화를 관찰한다',0,3,'균열의 중심을 보았다.'],['균열의 주기를 계산한다',1,3,'틈이 줄어드는 시간을 알아냈다.'],['균열을 다른 차원으로 연결할 구상을 한다',4,3,'또 하나의 해법을 얻었다.']],

['최후의 신전으로 가는 길이 갈라졌다.', ['새 길을 직접 개척한다',0,3,'막힌 길을 넘어섰다.'],['동료들과 지도를 만들어 이동한다',5,3,'모두가 길을 잃지 않았다.'],['기존 단서를 조합해 지름길을 만든다',4,3,'숨겨진 입구를 발견했다.']]]},
{title:'영혼의 거울',icon:'🔮',intro:'여행의 마지막 장소에 도착했다. 이곳에서 그동안 해 온 선택을 돌아본다.',scenes:[
['거울이 그동안의 여정을 보여준다.', ['가장 어려웠던 도전을 다시 바라본다',0,3,'도전이 당신의 일부가 되었다.'],['기록의 의미를 다시 해석한다',1,3,'그동안 몰랐던 연결을 발견했다.'],['함께한 이들의 표정을 기억한다',2,3,'가장 소중했던 순간들이 빛났다.']],
['거울 속 세계가 완전히 멈춰 있다.', ['굳게 멈춘 문을 꾸준히 움직인다',3,3,'문이 조금씩 열리기 시작했다.'],['새로운 세계의 모습을 상상한다',4,3,'거울이 낯선 색으로 빛났다.'],['동료들과 힘을 모아 마법진을 완성한다',5,3,'서로의 빛이 이어졌다.']],
['거울이 여섯 개의 빛을 비춘다.', ['가장 먼 곳까지 나아가는 길을 택한다',0,3,'당신이 걸어온 길이 붉게 빛났다.'],['숨겨진 의미를 해석하는 길을 택한다',1,3,'당신이 걸어온 길이 푸르게 빛났다.'],['누군가를 위한 길을 택한다',2,3,'당신이 걸어온 길이 따뜻하게 빛났다.']],
['마지막 문을 열기 위해 하나의 의지가 필요하다.', ['끝까지 지켜야 할 약속을 세운다',3,3,'오래된 문이 흔들리기 시작했다.'],['아직 없던 미래를 그려낸다',4,3,'문 너머에 새로운 별이 떠올랐다.'],['모든 동료에게 손을 내민다',5,3,'모두의 힘이 하나로 모였다.']]]}
];
const branches=[['이전에 남긴 발자국 덕분에 다른 길이 열렸다.','멀리서 새로운 흔적을 발견했다.','동료가 앞서 선택한 길에 대해 이야기한다.'],['주민들이 당신의 이전 행동을 기억하고 있다.','카이가 정비된 장치를 보여준다.','엘리오가 마을에서 들은 소문을 전한다.'],['루나가 유적에서 발견한 단서를 건넸다.','오래된 기록이 앞선 선택에 반응했다.','당신이 표시한 길에서 새 문양이 빛났다.'],['왕국의 사람들이 당신을 알아본다.','궁정 기록에 당신의 이름이 남았다.','마을의 소식이 궁정에 도착했다.'],['과거의 약속이 지금의 결정을 바꾼다.','모아둔 단서가 하나로 연결되기 시작한다.','동료의 작은 행동이 중요한 열쇠가 됐다.'],['거울은 당신의 여정을 차례로 비춘다.','손등의 문양이 한층 선명해진다.','여섯 능력치의 빛이 거울에 모인다.']];
const app=document.getElementById('app');const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function store(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function getState(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.stats)&&x.stats.length===6&&Number.isInteger(x.step)&&x.step>=0&&x.step<=24&&Array.isArray(x.log))return x;}catch(e){}return null}
let state=getState();function fresh(){return {step:0,stats:[10,10,10,10,10,10],log:[],party:[],flags:[],seed:Math.floor(Math.random()*1000000),done:false}}
function header(){return '<div class="top">✧ THE OTHER WORLD ✧</div>'}
function statsHtml(){return `<div class="stats">${state.stats.map((v,i)=>`<div class="stat"><div class="statline"><span>${statIcons[i]} ${statNames[i]}</span><b>${v}</b></div><div class="bar"><div class="fill" style="width:${Math.min(100,v/45*100)}%"></div></div></div>`).join('')}</div>`}
function home(){let old=false;try{old=!!localStorage.getItem(LEGACY)}catch(e){}app.innerHTML=header()+`<div class="art">🔮</div><h1>낯선 세계의 기록</h1><p style="text-align:center">네 선택에 따라 능력치가 오르거나 내려가고, 마지막에 환상종이 정해진다.</p><div class="panel"><span class="pill">6장</span> <span class="pill">24번 선택</span> <span class="pill">16종 환상종</span><p>모든 선택에는 장점과 대가가 있어. 능력치가 낮아지면 다음 사건도 달라져. 게임오버는 없어.</p><button class="btn primary" id="new">새 모험 시작</button>${state?'<button class="btn ghost" id="resume">이어하기</button>':''}<button class="btn ghost" id="dex">환상종 도감</button></div>${old?'<p class="mini">2.0 저장 기록이 발견됐어. 이전 기록은 그대로 두고 3.0은 별도로 저장돼.</p>':''}<p class="mini">이 게임은 가치관 육성 게임이며 전문 심리검사가 아니야. 저장 정보는 현재 브라우저에만 보관돼.</p>`;document.getElementById('new').onclick=()=>{if(state&&!confirm('3.0 모험을 새로 시작할까요? 기존 3.0 진행은 초기화됩니다.'))return;state=fresh();store();render()};if(state)document.getElementById('resume').onclick=render;document.getElementById('dex').onclick=()=>dex('home')}
function currentScene(){const c=Math.floor(state.step/4),p=state.step%4;let scene=chapters[c].scenes[p];if(p===2){const rotation=(state.seed+c*3+(state.log[c*4+1]?.option||0))%3;const rot=[scene[1+rotation],scene[1+(rotation+1)%3],scene[1+(rotation+2)%3]];return [scene[0],...rot]}return scene}
function modifiedChoice(o){
  const benefit=o[1];
  // Every action has a trade-off. Different skills can be sacrificed.
  const trade=[3,5,0,4,1,2][benefit];
  return {benefit,plus:o[2],trade,minus:2};
}
function situation(){
  const low=state.stats.map((value,index)=>({value,index})).sort((a,b)=>a.value-b.value)[0];
  const last=state.log.at(-1);
  if(!last || low.value>=10)return '';
  const scenes=[
    ['용기가 부족해 망설이는 사이 길이 막혔다. 대신 동료가 우회로를 알려줬다.','다음 행동에선 주변을 살필 시간이 더 필요하다.'],
    ['단서를 읽는 데 시간이 걸려 이동이 늦어졌다. 동료와 기록을 나눠 확인했다.','서두르기보다 먼저 정보를 정리해야 한다.'],
    ['동료의 기분을 놓쳐 잠시 분위기가 어색해졌다. 대화를 나누며 다시 출발했다.','상대의 입장을 묻는 일이 중요해졌다.'],
    ['피로가 쌓여 잠시 쉬어 가야 했다. 동료들도 휴식을 제안했다.','쉬어 가더라도 여행은 계속된다.'],
    ['익숙한 방법만 떠올라 해결이 늦어졌다. 주변의 도구를 다시 살펴봤다.','다른 접근법이 필요해졌다.'],
    ['혼자 일을 맡다 보니 진행이 늦어졌다. 동료에게 역할을 나눴다.','도움이 필요한 순간이다.']
  ];
  return `<div class="consequence"><b>${statIcons[low.index]} ${statNames[low.index]} 부족으로 생긴 일</b><p>${escapeHtml(scenes[low.index][0])}</p><span class="mini">${escapeHtml(scenes[low.index][1])}</span></div>`;
}
function render(){if(!state)return home();if(state.step>=24)return awaken();const c=Math.floor(state.step/4),p=state.step%4,ch=chapters[c],sc=currentScene(),last=state.log.at(-1);let lead=p===0?ch.intro:branches[c][(state.seed+(last?last.option:0))%3];if(last && last.chapter===c+1)lead=last.outcome+' '+lead;const party=state.party.length?state.party.join(' · '):'아직 없음';app.innerHTML=header()+`<div class="chapter"><b>제${c+1}장 · ${ch.title}</b><span>${state.step+1} / 24</span></div><div class="bar" style="margin:12px 0"><div class="fill" style="width:${state.step/24*100}%"></div></div><div class="art">${ch.icon}</div><div class="panel"><div class="pill">모험가 능력치</div>${statsHtml()}<p class="mini">선택 시 능력치가 오르고 다른 능력치가 내려갑니다. 최솟값은 0이며 게임오버는 없습니다.</p><p class="mini">동료: ${escapeHtml(party)}</p></div><div class="panel"><p>${escapeHtml(lead)}</p>${situation()}<h2>${escapeHtml(sc[0])}</h2>${sc.slice(1).map((x,i)=>`<button class="btn choice" data-option="${i}"><strong>${escapeHtml(x[0])}</strong><div class="gain">${statIcons[x[1]]} ${statNames[x[1]]} +${x[2]} <span class="loss">· ${statIcons[modifiedChoice(x).trade]} ${statNames[modifiedChoice(x).trade]} −${modifiedChoice(x).minus}</span></div></button>`).join('')}</div><button class="btn ghost" id="home">첫 화면으로</button>`;document.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>choose(Number(b.dataset.option)));document.getElementById('home').onclick=home}
function choose(i){if(!state||state.step>=24)return;const c=Math.floor(state.step/4),p=state.step%4,sc=currentScene(),o=sc[i+1];if(!o)return;const cost=modifiedChoice(o);state.stats[o[1]]=Math.min(99,state.stats[o[1]]+o[2]);state.stats[cost.trade]=Math.max(0,state.stats[cost.trade]-cost.minus);state.log.push({chapter:c+1,scene:sc[0],choice:o[0],stat:o[1],gain:o[2],lossStat:cost.trade,loss:cost.minus,outcome:o[3],option:i});if(c===0&&p===1&&!state.party.includes('엘리오'))state.party.push('엘리오');if(c===1&&p===1&&!state.party.includes('카이'))state.party.push('카이');if(c===2&&p===1&&!state.party.includes('루나'))state.party.push('루나');if(c===0&&p===3)state.flags.push('어린 용과의 만남');if(c===2&&p===2)state.flags.push('거울의 단서');state.step++;if(state.step===24)state.done=true;store();render()}
function ranking(){const gains=state.stats.map(x=>x-10);return creatures.map(cr=>{const weights=personalities[cr[0]];const total=weights.reduce((a,b)=>a+b,0);const score=weights.reduce((sum,w,i)=>sum+w*gains[i],0)/total;return {cr,score}}).sort((a,b)=>b.score-a.score||a.cr[0].localeCompare(b.cr[0],'ko'))}
function awaken(){app.innerHTML=header()+`<div class="panel reveal" style="text-align:center;margin-top:65px"><div class="rune">✧</div><h1>여행의 결말</h1><p>여행에서 쌓아 온 선택을 살펴보자.\n가장 많이 키운 능력치에 따라 결과가 정해져.</p><button class="btn primary" id="show">결과 확인하기</button></div>`;document.getElementById('show').onclick=result}
function result(){const ranks=ranking(),cr=ranks[0].cr,order=state.stats.map((x,i)=>({x,i})).sort((a,b)=>b.x-a.x||a.i-b.i),top=order.slice(0,2),story=state.log.filter((x,i)=>i%4===3);app.innerHTML=header()+`<div class="panel reveal"><div class="pill">모험 완료 · 24 / 24</div><div class="bigemoji">${cr[2]}</div><h1>${cr[0]}</h1><p style="text-align:center;color:var(--gold);font-size:19px">${cr[1]}</p><p>${cr[3]}</p><div class="line"></div><h2>성장한 가치</h2>${statsHtml()}<p>너는 모험에서 <b>${statNames[top[0].i]}</b>와 <b>${statNames[top[1].i]}</b>를 가장 많이 성장시켰어. 이 조합과 가장 가까운 환상종은 <b>${cr[0]}</b>이야.</p><h2>너의 강점과 고민</h2><p><b>강점:</b> ${cr[4]}\n<b>조심할 점:</b> ${cr[5]}</p><h2>여정의 기억</h2>${story.map(x=>`<div class="log">${escapeHtml(x.choice)}<br><span class="mini">${escapeHtml(x.outcome)}</span></div>`).join('')}<p class="mini">동료: ${escapeHtml(state.party.join(', ')||'없음')} · 발견한 단서: ${escapeHtml(state.flags.join(', ')||'없음')}</p><p class="mini">가치관 육성 게임 결과이며 실제 성격에 대한 확정적인 진단이 아니야.</p></div><button class="btn primary" id="share">결과 공유하기</button><button class="btn ghost" id="retry">다시 모험하기</button><button class="btn ghost" id="dex">도감 보기</button>`;document.getElementById('retry').onclick=()=>{if(!confirm('새 모험을 시작할까요?'))return;state=fresh();store();render()};document.getElementById('dex').onclick=()=>dex('result');document.getElementById('share').onclick=async()=>{const t=`내가 성장시킨 가치는 ${statNames[top[0].i]}와 ${statNames[top[1].i]}! 환상종은 ${cr[2]} ${cr[0]} — ${cr[1]}!`;try{if(navigator.share)await navigator.share({title:'환상종 RPG 3.0',text:t,url:location.href});else if(navigator.clipboard){await navigator.clipboard.writeText(t+'\n'+location.href);alert('복사 완료!')}else prompt('공유할 문구',t)}catch(e){if(e.name!=='AbortError')prompt('공유할 문구',t)}}}
function dex(origin='home'){window.scrollTo(0,0);app.innerHTML=header()+`<h1>환상종 도감</h1><p class="muted" style="text-align:center">16종 모두 이모지로 표시돼.</p><div class="dex">${creatures.map(cr=>`<div class="tile"><div class="emoji">${cr[2]}</div><b>${cr[0]}</b><p>${cr[1]}</p></div>`).join('')}</div><button class="btn primary" id="back">돌아가기</button>`;document.getElementById('back').onclick=()=>{if(origin==='result'&&state&&state.step>=24)result();else home();window.scrollTo(0,0)}}
home();
</script></body></html>
